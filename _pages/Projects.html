---
layout: projects
title: "Projects"
permalink: /projects/
---
{% include base_path %}

<div class="reel">
  <div class="reel-head">
    <h1>Projects</h1>
  </div>

  <div class="reel-stagewrap">
    <button class="reel-arrow" id="rPrev" aria-label="Previous">&lsaquo;</button>
    <div class="reel-stage" id="rStage"></div>
    <button class="reel-arrow" id="rNext" aria-label="Next">&rsaquo;</button>
  </div>

  <div class="reel-info">
    <div class="reel-bignum"><span id="rNum">01</span><span class="reel-tot" id="rTot">/08</span></div>
    <div class="reel-meta">
      <div class="reel-titlerow">
        <span class="reel-year" id="rYear"></span>
        <h2 class="reel-title" id="rTitle"></h2>
      </div>
      <div class="reel-tags" id="rTags"></div>
      <p class="reel-cap" id="rCap"></p>
    </div>
  </div>

  <div class="reel-controls">
    <button class="reel-play" id="rPlay"><span class="ic">&#9658;</span> <span id="rPlayLabel">Auto-play</span></button>
    <span class="reel-counter" id="rCounter">01 / 09</span>
    <span class="reel-keys">&larr; &rarr; to browse</span>
  </div>

  <div class="reel-thumbs" id="rThumbs"></div>
</div>

<style>
.reel{
  --r-ink:#33383d; --r-soft:#727880; --r-rose:#c25b6c; --r-teal:#52adc8;
  --r-line:#e7e7ea; --r-stage:#141416;
  max-width:1080px; margin:0 auto; padding:1.4rem 1rem 3.5rem;
}
.reel *{box-sizing:border-box}
.reel-head{text-align:center; margin-bottom:1.8rem}
.reel-head h1{font-size:2rem; font-weight:700; color:var(--r-ink); margin:0 0 .5rem; letter-spacing:-.01em}
.reel-head p{color:var(--r-soft); font-size:.98rem; max-width:60ch; margin:0 auto; line-height:1.55}

.reel-stagewrap{display:flex; align-items:center; gap:14px}
.reel-arrow{
  flex:0 0 auto; width:46px; height:46px; border-radius:50%; border:1px solid var(--r-line);
  background:#fff; color:var(--r-ink); cursor:pointer; font-size:22px; line-height:1;
  display:flex; align-items:center; justify-content:center; transition:all .22s; padding:0;
}
.reel-arrow:hover{border-color:var(--r-rose); color:var(--r-rose); box-shadow:0 6px 16px -8px rgba(194,91,108,.5)}
.reel-arrow:active{transform:scale(.94)}

.reel-stage{
  position:relative; flex:1; aspect-ratio:16/9; border-radius:14px; overflow:hidden;
  background:var(--r-stage); box-shadow:0 24px 60px -30px rgba(0,0,0,.45);
}
.reel-slide{position:absolute; inset:0; opacity:0; transition:opacity .5s ease; pointer-events:none; background:#0c0c0d; display:flex; align-items:center; justify-content:center}
.reel-slide.on{opacity:1; pointer-events:auto}
.reel-slide video{width:100%; height:100%; object-fit:contain; display:block; background:#0c0c0d}
.reel-prog{position:absolute; left:0; bottom:0; height:3px; width:0; background:var(--r-rose); z-index:4}

.reel-info{display:grid; grid-template-columns:auto 1fr; gap:0 24px; align-items:start; margin-top:1.6rem}
.reel-bignum{font-size:3.4rem; font-weight:300; line-height:.85; color:var(--r-rose); letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.reel-bignum .reel-tot{font-size:1rem; color:var(--r-soft)}
.reel-titlerow{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.reel-year{font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--r-soft); position:relative; padding-bottom:.35rem}
.reel-year::after{content:""; position:absolute; left:0; bottom:0; width:34px; border-top:3px solid var(--r-rose)}
.reel-title{font-size:1.6rem; font-weight:600; color:var(--r-ink); margin:0; line-height:1.1; letter-spacing:-.01em}
.reel-tags{display:flex; flex-wrap:wrap; gap:7px; margin-top:.7rem}
.reel-tag{font-size:.68rem; letter-spacing:.02em; color:var(--r-teal); border:1px solid rgba(82,173,200,.35); background:rgba(82,173,200,.08); border-radius:20px; padding:3px 10px}
.reel-cap{font-family:Georgia,"Times New Roman",serif; font-style:italic; color:#565b61; font-size:1.02rem; line-height:1.5; margin:.85rem 0 0; max-width:66ch}

.reel-controls{display:flex; align-items:center; justify-content:center; gap:18px; margin-top:1.8rem; flex-wrap:wrap}
.reel-play{
  border:1px solid var(--r-rose); color:#fff; background:var(--r-rose); cursor:pointer;
  padding:9px 18px; border-radius:22px; font-size:.85rem; letter-spacing:.02em; display:inline-flex; align-items:center; gap:8px; transition:all .2s;
}
.reel-play:hover{filter:brightness(1.06)}
.reel-play.off{background:#fff; color:var(--r-ink); border-color:var(--r-line)}
.reel-play.off:hover{border-color:var(--r-rose); color:var(--r-rose)}
.reel-counter{font-size:.8rem; color:var(--r-soft); letter-spacing:.06em; font-variant-numeric:tabular-nums}
.reel-keys{font-size:.72rem; color:#a7abb1; letter-spacing:.04em}

.reel-thumbs{display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-top:1.8rem}
.reel-thumb{
  position:relative; width:92px; height:54px; border-radius:7px; overflow:hidden; cursor:pointer;
  border:1px solid var(--r-line); background:#000; opacity:.62; transition:all .25s; padding:0;
}
.reel-thumb img{width:100%; height:100%; object-fit:cover; display:block}
.reel-thumb:hover{opacity:.9; transform:translateY(-2px)}
.reel-thumb.on{opacity:1; border-color:var(--r-rose); box-shadow:0 0 0 1px var(--r-rose)}
.reel-thumb .tn{position:absolute; top:2px; left:5px; font-size:9px; color:#fff; text-shadow:0 1px 2px #000; font-weight:600}

@media(max-width:640px){
  .reel-info{grid-template-columns:1fr; gap:.4rem}
  .reel-bignum{font-size:2.4rem}
  .reel-arrow{width:38px; height:38px; font-size:18px}
  .reel-title{font-size:1.3rem}
}
</style>

<script>
(function(){
  "use strict";
  var DIR = "{{ '/assets/reel/' | relative_url }}";
  var projects = [
    {file:"02_speedup.mp4",    year:"2025", title:"PACE",                  tags:["Real Robot","UR10e","Manipulation"],
     cap:"Speeds up a learned policy's execution by up to 3× on a real UR10e, with no extra training."},
    {file:"05_rlpolicy.mp4",   year:"2025", title:"GORL Grasp Optimization", tags:["MuJoCo","PPO","Dexterous"],
     cap:"A dexterous grasping policy trained with PPO in a custom MuJoCo environment."},
    {file:"01_rfmgrasp.mp4",   year:"2025", title:"RFM-Grasp",             tags:["SE(3)","Flow Matching","Grasping"],
     cap:"Grasp generation via flow matching directly on the SE(3) manifold, reaching ~99% success on unseen ACRONYM objects within 10 samples."},
    {file:"06_exploration.mp4",year:"2025", title:"Cave Exploration Drone",tags:["SE(3) Control","ROS","Mapping"],
     cap:"Autonomous cave exploration with an SE(3) geometric controller and skeletonized occupancy maps for junction detection."},
    {file:"09_rescue.mp4",     year:"2025", title:"Search & Rescue Robot", tags:["Autonomous Nav","SLAM","Artifact Detection"],
     cap:"Autonomous exploration of a collapsed building course, mapping unknown terrain and detecting rescue artifacts on the fly."},
    {file:"03_car.mp4",        year:"2021", title:"BURST Autonomous Car",  tags:["Perception","Control","TEKNOFEST"],
     cap:"Autonomous vehicle with real time perception and control, winner of the TEKNOFEST 2021 Most Original Software award."},
    {file:"08_rbik.mp4",       year:"2023", title:"Rubik's Cube Robot",    tags:["Hardware","Mechatronics","Control"],
     cap:"A Rubik's cube solving robot built entirely from scratch, including the mechanism, electronics, and control stack."},
    {file:"04_drawbot.mp4",    year:"2024", title:"Drawing Robot",         tags:["Motion Planning","KOMO","Perception"],
     cap:"A robot arm that plans each stroke as a KOMO optimization problem, drawing from visual perception alone."},
    {file:"07_cnmp.mp4",       year:"2023", title:"CNMP Motion Blending",  tags:["Learning from Demo","CNMP","Attention"],
     cap:"Locally weighted Conditional Neural Movement Primitives that blend human demonstrations into new motions."}
  ];

  var stage=document.getElementById('rStage'), thumbs=document.getElementById('rThumbs');
  var vids=[];
  projects.forEach(function(p,i){
    var s=document.createElement('div'); s.className='reel-slide';
    var v=document.createElement('video');
    v.src=DIR+p.file; v.muted=true; v.loop=true; v.playsInline=true; v.setAttribute('playsinline','');
    v.preload=i===0?'auto':'metadata'; v.poster=DIR+p.file.replace('.mp4','.jpg');
    s.appendChild(v);
    var pr=document.createElement('div'); pr.className='reel-prog'; s.appendChild(pr);
    stage.appendChild(s); vids.push({slide:s,video:v,prog:pr});

    var t=document.createElement('button'); t.className='reel-thumb'; t.type='button';
    t.innerHTML='<img src="'+DIR+p.file.replace('.mp4','.jpg')+'" alt="'+p.title+'"><span class="tn">'+pad(i+1)+'</span>';
    t.addEventListener('click',function(){ if(auto)setAuto(false); go(i); });
    thumbs.appendChild(t);
  });
  function pad(n){return (n<10?'0':'')+n;}

  var cur=0, auto=false, timer=null;
  var elNum=document.getElementById('rNum'), elYear=document.getElementById('rYear'),
      elTitle=document.getElementById('rTitle'), elTags=document.getElementById('rTags'),
      elCap=document.getElementById('rCap'), elCounter=document.getElementById('rCounter'),
      elTot=document.getElementById('rTot'),
      playBtn=document.getElementById('rPlay'), playLabel=document.getElementById('rPlayLabel');

  var TOT=pad(projects.length);
  if(elTot) elTot.textContent='/'+TOT;

  function render(i){
    var p=projects[i];
    elNum.textContent=pad(i+1);
    elYear.textContent=p.year;
    elTitle.textContent=p.title;
    elCap.textContent=p.cap;
    elCounter.textContent=pad(i+1)+' / '+TOT;
    elTags.innerHTML=''; p.tags.forEach(function(tg){var e=document.createElement('span'); e.className='reel-tag'; e.textContent=tg; elTags.appendChild(e);});
    var ts=thumbs.querySelectorAll('.reel-thumb'); for(var k=0;k<ts.length;k++) ts[k].classList.toggle('on',k===i);
  }
  function stopAll(){
    vids.forEach(function(o){o.slide.classList.remove('on'); o.prog.style.transition='none'; o.prog.style.width='0'; try{o.video.pause(); o.video.currentTime=0;}catch(e){}});
    if(timer){clearTimeout(timer); timer=null;}
  }
  function go(i){
    i=(i+projects.length)%projects.length; stopAll(); cur=i;
    var o=vids[i]; o.slide.classList.add('on'); render(i);
    var pv=o.video.play(); if(pv&&pv.catch) pv.catch(function(){});
    var nx=vids[(i+1)%projects.length].video; if(nx.preload!=='auto') nx.preload='auto';
    if(auto) startDwell(o);
  }
  function startDwell(o){
    if(!auto) return;
    if(timer){clearTimeout(timer); timer=null;}
    var d=isFinite(o.video.duration)&&o.video.duration>0?o.video.duration:5;
    var dwell=Math.max(d,4)*1000+300;
    o.prog.style.transition='none'; o.prog.style.width='0';
    requestAnimationFrame(function(){requestAnimationFrame(function(){o.prog.style.transition='width '+(dwell/1000)+'s linear'; o.prog.style.width='100%';});});
    timer=setTimeout(function(){ if(auto) go(cur+1); }, dwell);
  }
  function setAuto(on){
    auto=on; playBtn.classList.toggle('off',!on);
    playLabel.textContent=on?'Playing…':'Auto-play';
    playBtn.querySelector('.ic').innerHTML=on?'&#10074;&#10074;':'&#9658;';
    if(on) startDwell(vids[cur]); else { if(timer){clearTimeout(timer); timer=null;} vids[cur].prog.style.transition='none'; vids[cur].prog.style.width='0'; }
  }

  document.getElementById('rNext').addEventListener('click',function(){ if(auto)setAuto(false); go(cur+1); });
  document.getElementById('rPrev').addEventListener('click',function(){ if(auto)setAuto(false); go(cur-1); });
  playBtn.addEventListener('click',function(){ setAuto(!auto); });
  document.addEventListener('keydown',function(e){
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key==='ArrowRight'){ if(auto)setAuto(false); go(cur+1); }
    else if(e.key==='ArrowLeft'){ if(auto)setAuto(false); go(cur-1); }
  });

  playBtn.classList.add('off');
  go(0);
})();
</script>
